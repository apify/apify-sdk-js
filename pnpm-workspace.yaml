packages:
  - website

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@apify/*'
  - '@crawlee/*'
  - 'apify-client'
  - 'apify'
  - 'crawlee'
  - 'got-scraping'
  # Renovate security update: vitest@4.1.0
  - vitest@4.1.0

allowBuilds:
  # Installed from GitHub until the local-runs work is released; the key pins the commit, so it changes with it.
  'apify-test-tools@https://codeload.github.com/apify/apify-test-tools/tar.gz/d85d2292ca2bf1693dbb0a543d077bb04b9ad282': true
  '@apify/ui-icons': false
  '@playwright/browser-chromium': true
  '@swc/core': true
  core-js: false
  esbuild: true
  playwright: true
  puppeteer: true

overrides:
  webpack-dev-server: ^6.0.0

nodeLinker: hoisted
linkWorkspacePackages: true
preferWorkspacePackages: true
publicHoistPattern:
  - '*'

patchedDependencies:
  '@signalwire/docusaurus-plugin-llms-txt@1.2.2': patches/@signalwire__docusaurus-plugin-llms-txt@1.2.2.patch
