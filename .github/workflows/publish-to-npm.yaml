name: Publish to NPM

on:
    workflow_dispatch:
        inputs:
            ref:
                description: Git ref to publish (branch, tag, or commit SHA)
                required: true
                type: string
            tag:
                description: NPM dist-tag
                required: true
                type: choice
                default: latest
                options:
                    - latest
                    - next
                    - next-v4
                    - rc

permissions:
    id-token: write # Required for OIDC
    contents: write # Required to push changelog/lock file updates

jobs:
    publish_to_npm:
        name: Publish to NPM
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.ref }}
                  token: ${{ secrets.APIFY_SERVICE_ACCOUNT_GITHUB_TOKEN }}
                  fetch-depth: 0
                  fetch-tags: true

            - name: Use Node.js 24
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  registry-url: 'https://registry.npmjs.org'

            - name: Install pnpm and dependencies
              uses: apify/actions/pnpm-install@v1.4.0

            - name: Build module
              run: pnpm build

            # Only the pre-release version outputs are used here, so changelog generation and
            # its GitHub API lookups are dead weight.
            - name: Resolve pre-release version
              id: prerelease
              if: ${{ inputs.tag != 'latest' }}
              uses: apify/actions/git-cliff-release@v1.5.0
              with:
                  release_type: prerelease
                  prerelease_id: ${{ inputs.tag == 'rc' && 'rc' || 'beta' }}
                  prerelease_registry: npm
                  prerelease_package: apify
                  add-github-links: false
                  cliff_config_path: >-
                      ${{ (inputs.tag == 'next-v4' || inputs.tag == 'rc')
                      && format('{0}/.github/cliff-premajor.toml', github.workspace)
                      || 'cliff.toml' }}

            - name: Set pre-release version
              if: ${{ inputs.tag != 'latest' }}
              run: pnpm version --no-git-tag-version --allow-same-version ${{ steps.prerelease.outputs.prerelease_version }}

            - name: Publish to NPM
              run: pnpm publish --tag ${{ inputs.tag }} --no-git-checks

            # RC releases produce no changelog and no commit on the branch, only a git
            # tag pointing at the released commit (the version bump lives only on npm).
            - name: Create git tag
              if: ${{ inputs.tag == 'rc' }}
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  git tag "v$VERSION"
                  git push origin "refs/tags/v$VERSION"
