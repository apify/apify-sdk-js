name: Publish to NPM

on:
    workflow_dispatch:
        inputs:
            ref:
                description: Git ref to publish (branch, tag, or commit SHA)
                required: true
                type: string
            tag:
                description: NPM dist-tag
                required: true
                type: choice
                default: latest
                options:
                    - latest
                    - next-v3

permissions:
    id-token: write # Required for OIDC
    contents: write # Required to push changelog/lock file updates

jobs:
    publish_to_npm:
        name: Publish to NPM
        runs-on: ubuntu-latest
        environment: npm
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ inputs.ref }}
                  token: ${{ secrets.APIFY_SERVICE_ACCOUNT_GITHUB_TOKEN }}
                  fetch-depth: 0
                  fetch-tags: true

            - name: Check that the ref is on a release branch
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  sha=$(git rev-parse HEAD)
                  branches=$(gh api --paginate "repos/$GITHUB_REPOSITORY/branches" --jq '.[].name' | grep -E '^(master|[0-9]+\.x)$')
                  for branch in $branches; do
                      status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$branch...$sha" --jq .status || true)
                      if [[ "$status" == "identical" || "$status" == "behind" ]]; then exit 0; fi
                  done
                  echo "::error::$sha is not on a release branch"
                  exit 1

            - name: Use Node.js 24
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  registry-url: 'https://registry.npmjs.org'

            - name: Install pnpm and dependencies
              uses: apify/actions/pnpm-install@v1.6.1

            - name: Build module
              run: pnpm build

            # Only the pre-release version outputs are used here, so changelog generation and
            # its GitHub API lookups are dead weight.
            - name: Resolve pre-release version
              id: prerelease
              if: ${{ inputs.tag != 'latest' }}
              uses: apify/actions/git-cliff-release@v1.6.1
              with:
                  release_type: prerelease
                  prerelease_id: beta
                  prerelease_registry: npm
                  prerelease_package: apify
                  premajor_version: ''
                  add-github-links: false

            - name: Set pre-release version
              if: ${{ inputs.tag != 'latest' }}
              run: pnpm version --no-git-tag-version --no-git-checks --allow-same-version ${{ steps.prerelease.outputs.prerelease_version }}

            - name: Publish to NPM
              run: pnpm publish --tag ${{ inputs.tag }} --no-git-checks
